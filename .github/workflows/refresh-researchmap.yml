name: Refresh researchmap data

on:
  workflow_dispatch:
  schedule:
    # Monday 05:15 JST, Sunday 20:15 UTC
    - cron: '15 20 * * 0'

permissions:
  contents: write

concurrency:
  group: researchmap-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch researchmap data
        run: node scripts/update-researchmap-cache.mjs
      - name: Commit refreshed snapshot
        run: |
          git add data/researchmap-cache.json
          if git diff --cached --quiet; then
            echo 'No change to saved data'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh saved researchmap data'
          git push
